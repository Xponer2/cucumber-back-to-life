# Gradle Properties
org.gradle.jvmargs = -Xmx6G

# Mapping Properties
mapping_channel = stable
mapping_version = 39

# Run Configurations
minecraft_username = Developer

# Mod Information
# group of the build: the other builds depend on io.github.xponer2:<rootProject.name> (settings.gradle)
maven_group = io.github.xponer2
mod_version = 8.0.16-dev
root_package = com.blakebr0.cucumber
mod_id = cucumber
mod_name = Cucumber Library: Back to Life
archives_name = cucumber-back-to-life-1.12.2

mod_description = Unofficial port of Cucumber Library 8.0 (Minecraft 1.21.1) to Minecraft 1.12.2, the library Mystical Agriculture: Back to Life is built on. Not made or supported by BlakeBr0: report problems to the Cucumber Library: Back to Life issue tracker.
mod_url = https://github.com/Xponer2/cucumber-back-to-life
mod_update_json =
# Delimit authors with commas
mod_authors = BlakeBr0, Xponer2 (1.12.2 port)
mod_credits = Cucumber Library by BlakeBr0 (https://github.com/BlakeBr0/Cucumber), MIT License.
mod_logo_path =

# Class generated at build time with VERSION, MOD_ID and MOD_NAME
tag_class_name = com.blakebr0.cucumber.CucumberBuild
